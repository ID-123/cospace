name: CoSpace CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Prepare standalone artifact
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: cospace-standalone
          path: .next/standalone/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: cospace-production
      cancel-in-progress: false

    steps:
      - name: Download standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: cospace-standalone
          path: ./artifact
      - name: Validate standalone artifact
        run: |
          test -f ./artifact/server.js
          test -f ./artifact/.next/BUILD_ID
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package artifact
        run: tar -czf cospace-release.tar.gz -C artifact .

      - name: Upload release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          scp -o StrictHostKeyChecking=yes \
            cospace-release.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/cospace-$RELEASE_ID.tar.gz"

      - name: Deploy release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/home/ubuntu/apps/cospace"
          RELEASE_DIR="$APP_DIR/releases/$RELEASE_ID"
          ARCHIVE="/tmp/cospace-$RELEASE_ID.tar.gz"
          LEGACY_CONFIG="/home/ubuntu/cospace/ecosystem.config.cjs"

          PREVIOUS_TARGET="$(readlink "$APP_DIR/current" 2>/dev/null || true)"

          set_current() {
            local target="$1"
            local temporary_link="$APP_DIR/.current-$RELEASE_ID"

            ln -s "$target" "$temporary_link"
            mv -Tf "$temporary_link" "$APP_DIR/current"
          }

          check_health() {
            for attempt in {1..20}; do
              if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then
                return 0
              fi

              sleep 2
            done

            return 1
          }

          rollback() {
            echo "Deployment failed. Restoring previous version..."

            if [ -n "$PREVIOUS_TARGET" ]; then
              set_current "$PREVIOUS_TARGET"
              pm2 startOrReload "$APP_DIR/ecosystem.config.cjs" --update-env || true
            else
              rm -f "$APP_DIR/current"
              pm2 startOrReload "$LEGACY_CONFIG" --update-env || true
            fi

            pm2 save || true
          }

          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          ln -sfn "$APP_DIR/shared/.env" "$RELEASE_DIR/.env"
          ln -sfn "$APP_DIR/shared/.env.local" "$RELEASE_DIR/.env.local"

          set_current "$RELEASE_DIR"

          if ! pm2 startOrReload "$APP_DIR/ecosystem.config.cjs" --update-env; then
            rollback
            exit 1
          fi

          if ! check_health; then
            rollback
            exit 1
          fi

          pm2 save
          rm -f "$ARCHIVE"

          echo "Deployment successful: $RELEASE_ID"
          REMOTE
